<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผู้ช่วยระเบียบ นาวา ดิจิทัล</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: chat app. Sticky header, a left rail (questions, settings, documents) beside one chat column with a sticky composer. The rail becomes a drawer on phones; sources open in a side sheet (bottom sheet on phones). */
:root {
  --bg: #c4e6ee;
  --surface: #ffffff;
  --surface-2: #a8d5e1;
  --soft: #eef8fb;
  --ink: #0f2430;
  --muted: #3d5160;
  --line: #93c4d2;
  --accent: #2540d9;
  --accent-ink: #ffffff;
  --accent-soft: #e4e9ff;
  --hl: #ffe27a;
  --ok: #11795a;
  --ok-soft: #ddf3ea;
  --warn: #8f5200;
  --warn-soft: #fbebd0;
  --bad: #b3261e;
  --bad-soft: #fbe1df;
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 14px;
  --head: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08242e; --surface: #0f3342; --surface-2: #164456; --soft: #0b2c3a; --ink: #e6f3f7; --muted: #9cc0cd; --line: #25596d;
    --accent: #8fa2ff; --accent-ink: #08242e; --accent-soft: #1e2a52; --hl: #6b5a12;
    --ok: #5fd3a8; --ok-soft: #12332a; --warn: #f0b45a; --warn-soft: #3a2a0e; --bad: #ff8a80; --bad-soft: #3a1715;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08242e; --surface: #0f3342; --surface-2: #164456; --soft: #0b2c3a; --ink: #e6f3f7; --muted: #9cc0cd; --line: #25596d;
  --accent: #8fa2ff; --accent-ink: #08242e; --accent-soft: #1e2a52; --hl: #6b5a12;
  --ok: #5fd3a8; --ok-soft: #12332a; --warn: #f0b45a; --warn-soft: #3a2a0e; --bad: #ff8a80; --bad-soft: #3a1715;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: .86em; }
.muted { color: var(--muted); }
svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 1px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); height: var(--head); border-bottom: 1px solid var(--line); }
.head-in { max-width: 1180px; margin-inline: auto; height: 100%; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; flex: none; }
.brand b { display: block; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand span { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn:hover { border-color: var(--accent); }
.menu-btn { display: none; }
.badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }

/* app grid */
.app { max-width: 1180px; margin-inline: auto; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.rail { position: sticky; top: calc(var(--head) + env(safe-area-inset-top, 0px)); height: calc(100dvh - var(--head) - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 16px 4px 24px 0; display: grid; gap: 18px; align-content: start; }
.rail h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.group details + details { border-top: 1px solid var(--line); }
.group summary { list-style: none; padding: 10px 14px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px; }
.group summary::-webkit-details-marker { display: none; }
.group summary::after { content: "+"; color: var(--muted); font-weight: 400; }
.group details[open] summary::after { content: "–"; }
.qs { display: grid; padding: 0 8px 8px; }
.qs button { text-align: left; border: 0; background: transparent; padding: 8px 8px; border-radius: 8px; font-size: 14px; min-height: 40px; }
.qs button:hover { background: var(--soft); }
.setting { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch { display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 32px; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.doclist { display: grid; gap: 2px; }
.doclist button { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; font-size: 13px; }
.doclist button:hover { background: var(--surface); }
.doclist .id { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.doclist .old { opacity: .65; text-decoration: line-through; text-decoration-thickness: 1px; }
.link-btn { border: 0; background: transparent; color: var(--accent); padding: 4px 0; font-size: 13px; text-decoration: underline; }

/* chat */
.chat { min-width: 0; display: flex; flex-direction: column; min-height: calc(100dvh - var(--head) - env(safe-area-inset-top, 0px)); }
.log { flex: 1; display: grid; gap: 18px; align-content: start; padding: 20px 0 24px; }
.msg { display: flex; gap: 10px; min-width: 0; }
.msg.user { justify-content: flex-end; }
.avatar { width: 32px; height: 32px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; margin-top: 2px; }
.bubble { min-width: 0; max-width: min(100%, 720px); }
.msg.user .bubble { background: var(--accent); color: var(--accent-ink); padding: 10px 16px; border-radius: 18px 18px 4px 18px; overflow-wrap: anywhere; }
.msg.bot .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 18px 18px 18px; padding: 14px 16px; display: grid; gap: 12px; flex: 1 1 auto; }
.bubble p { margin: 0; }
.ans p + p { margin-top: 8px; }
.cite { display: inline-block; border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 7px; margin-left: 4px; font-family: var(--mono); font-size: 12px; line-height: 1.7; vertical-align: baseline; }
.cite:hover { background: var(--accent); color: var(--accent-ink); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 1.7; white-space: nowrap; background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.note { padding: 10px 12px; border-radius: 10px; font-size: 14px; background: var(--warn-soft); color: var(--warn); }
.note.info { background: var(--accent-soft); color: var(--accent); }
.note b { font-weight: 600; }
.old-line { margin-top: 4px; opacity: .85; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; min-height: 34px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn svg { width: 16px; height: 16px; }
.follow { display: flex; flex-wrap: wrap; gap: 6px; }
.follow button { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 999px; padding: 4px 12px; font-size: 13px; min-height: 34px; text-align: left; }
.follow button:hover { background: var(--accent-soft); }
.steps { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.steps div { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.steps .done .dot { background: var(--ok); }
.steps .run .dot { background: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.src { display: grid; gap: 8px; }
.src details { border: 1px solid var(--line); border-radius: 10px; background: var(--soft); }
.src summary { cursor: pointer; padding: 8px 12px; font-size: 14px; font-weight: 500; min-height: 40px; display: flex; align-items: center; }
.src-body { padding: 4px 12px 12px; display: grid; gap: 8px; }
.hit { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.hit button.t { all: unset; cursor: pointer; font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.hit button.t:hover { color: var(--accent); text-decoration: underline; }
.hit button.t:focus-visible { outline: 2px solid var(--accent); }
.hit p { font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; white-space: pre-line; }
.bar { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.qinfo { font-size: 13px; color: var(--muted); }
.qinfo code { font-family: var(--mono); font-size: 12px; background: var(--surface); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }

/* welcome */
.welcome { display: grid; gap: 14px; }
.welcome h1 { margin: 0; font-size: clamp(20px, 3.4vw, 26px); line-height: 1.3; text-wrap: balance; }
.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.starters button { text-align: left; border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; display: grid; gap: 2px; min-height: 64px; align-content: start; }
.starters button:hover { border-color: var(--accent); }
.starters small { color: var(--muted); font-size: 12px; }

/* composer */
.composer-wrap { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 78%, transparent); padding: 12px 0 calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
.composer { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 8px 8px 8px 16px; box-shadow: 0 4px 20px rgba(8, 36, 46, .14); }
.composer:focus-within { border-color: var(--accent); }
.composer textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; resize: none; max-height: 140px; min-height: 28px; padding: 6px 0; line-height: 1.5; }
.send { width: 42px; height: 42px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .4; cursor: default; }
.foot { margin: 8px 4px 0; font-size: 12px; color: var(--muted); text-align: center; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(5, 22, 29, .5); z-index: 70; }
.sheet { position: fixed; z-index: 80; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; top: 0; right: 0; bottom: 0; width: min(440px, 100%); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: -8px 0 30px rgba(5, 22, 29, .25); }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; padding: 16px; border-bottom: 1px solid var(--line); }
.sheet-head h3 { margin: 0; font-size: 16px; line-height: 1.35; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sheet-body { padding: 16px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.sheet-body .text { white-space: pre-line; overflow-wrap: anywhere; line-height: 1.75; }
.secs { display: flex; flex-wrap: wrap; gap: 6px; }
.secs button { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 4px 12px; font-size: 13px; min-height: 34px; }
.secs button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 13px; z-index: 90; }

@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: grid; }
  .rail { position: fixed; z-index: 75; top: 0; left: 0; bottom: 0; height: auto; width: min(340px, 90vw); background: var(--bg); padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 8px 0 30px rgba(5, 22, 29, .3); transform: translateX(-105%); visibility: hidden; transition: transform .22s, visibility .22s; }
  .rail.open { transform: none; visibility: visible; }
  .badge { display: none; }
  .sheet { top: auto; left: 0; right: 0; width: 100%; max-height: 82dvh; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(5, 22, 29, .25); }
}
@media (min-width: 900px) { .rail-close { display: none; } }
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } .steps .run .dot { animation: none; } }
</style>

<header class="head">
  <div class="head-in">
    <button class="icon-btn menu-btn" id="menu" type="button" aria-label="เปิดเมนูหัวข้อและตั้งค่า" aria-expanded="false" aria-controls="rail">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand">
      <div class="logo" aria-hidden="true">N</div>
      <div><b>ผู้ช่วยระเบียบบริษัท</b><span>นาวา ดิจิทัล · ตอบจากเอกสาร 24 ฉบับ</span></div>
    </div>
    <span class="badge" title="คำตอบเรียบเรียงในเบราว์เซอร์ ไม่มีการเรียกโมเดลภาษา">ไม่ใช้ LLM</span>
    <button class="icon-btn" id="clear" type="button" aria-label="เริ่มบทสนทนาใหม่" title="เริ่มใหม่">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg>
    </button>
    <button class="icon-btn" id="theme" type="button" aria-label="สลับธีมสว่างและมืด" title="สลับธีม">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
  </div>
</header>

<div class="app">
  <aside class="rail" id="rail" aria-label="หัวข้อ ตั้งค่า และเอกสาร">
    <div class="row rail-close"><h2 style="margin:0">เมนู</h2><button class="icon-btn" id="railclose" type="button" aria-label="ปิดเมนู"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <section>
      <h2>ถามได้เลย</h2>
      <div class="group" id="topics"></div>
    </section>
    <section>
      <h2>ตั้งค่าการค้นหา</h2>
      <div class="setting">
        <div>
          <div class="row"><label for="k" style="font-size:14px;font-weight:500">จำนวนแหล่งอ้างอิง</label><b class="mono" id="kv">4</b></div>
          <input type="range" id="k" min="1" max="6" value="4">
        </div>
        <label class="switch" for="inc"><input type="checkbox" id="inc"> รวมฉบับเก่าในการค้นหา</label>
        <label class="switch" for="sc"><input type="checkbox" id="sc"> แสดงคะแนนความคล้าย</label>
      </div>
    </section>
    <section>
      <h2>เอกสารทั้งหมด</h2>
      <div class="doclist" id="docs"></div>
    </section>
  </aside>

  <main class="chat">
    <div class="log" id="log" role="log" aria-live="polite" aria-label="บทสนทนา"></div>
    <div class="composer-wrap">
      <form class="composer" id="form" autocomplete="off">
        <label class="sr" for="input">พิมพ์คำถามเกี่ยวกับระเบียบบริษัท</label>
        <textarea id="input" rows="1" placeholder="ถามเรื่องลา สวัสดิการ เบิกจ่าย IT ..." enterkeyhint="send"></textarea>
        <button class="send" id="send" type="submit" aria-label="ส่งคำถาม" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </form>
      <p class="foot">คำตอบดึงประโยคจากเอกสารโดยตรง ตรวจจากแหล่งอ้างอิงได้ทุกครั้ง ข้อมูลทั้งหมดเป็นของสมมติ</p>
    </div>
  </main>
</div>

<div id="scrim" class="scrim" hidden></div>
<aside id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-head">
    <h3 id="sheet-title"></h3>
    <button class="icon-btn" id="sheetclose" type="button" aria-label="ปิดแหล่งอ้างอิง"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetbody"></div>
</aside>

เกิน 5 วันทำการต้องยื่นล่วงหน้า 14 วัน"},{"id":"HR-01#3","doc":"HR-01","title":"ระเบียบการลา","section":"ลาป่วย","status":"active","date":"2026-01-01","text":"ลาป่วยได้ตามจริงไม่เกิน 30 วันทำการต่อปีโดยได้รับค่าจ้าง หากลาป่วยตั้งแต่ 3 วันทำการติดต่อกันขึ้นไปต้องแนบใบรับรองแพทย์\nแจ้งหัวหน้างานภายในเวลา 09.30 น. ของวันที่ลา และบันทึกในระบบ HR Portal ภายใน 2 วันทำการหลังกลับมาทำงาน"},{"id":"HR-01#4","doc":"HR-01","title":"ระเบียบการลา","section":"ลากิจ","status":"active","date":"2026-01-01","text":"ลากิจได้ 6 วันทำการต่อปีโดยได้รับค่าจ้าง ต้องยื่นล่วงหน้าอย่างน้อย 1 วันทำการ ยกเว้นกรณีฉุกเฉิน"},{"id":"HR-01#5","doc":"HR-01","title":"ระเบียบการลา","section":"ลาคลอดและลาเพื่อดูแลบุตร","status":"active","date":"2026-01-01","text":"พนักงานหญิงลาคลอดได้ 120 วัน โดยบริษัทจ่ายค่าจ้างเต็มจำนวน 60 วัน พนักงานชายลาเพื่อช่วยภรรยาเลี้ยงดูบุตรได้ 15 วันทำการโดยได้รับค่าจ้าง ต้องใช้ภายใน 90 วันหลังบุตรเกิด"},{"id":"HR-01#6","doc":"HR-01","title":"ระเบียบการลา","section":"ลาอุปสมบทและลาประกอบพิธีฮัจญ์","status":"active","date":"2026-01-01","text":"ลาได้ 15 วันทำการโดยได้รับค่าจ้าง ใช้สิทธิ์ได้ 1 ครั้งตลอดการทำงาน และต้องมีอายุงานครบ 1 ปี"},{"id":"HR-02#1","doc":"HR-02","title":"การทำงานแบบไฮบริด","section":"หลักการ","status":"active","date":"2026-07-01","text":"บริษัทสนับสนุนการทำงานแบบไฮบริด โดยวัดผลจากผลงาน ไม่ใช่จำนวนชั่วโมงที่อยู่ในออฟฟิศ"},{"id":"HR-02#2","doc":"HR-02","title":"การทำงานแบบไฮบริด","section":"จำนวนวันทำงานจากที่บ้าน","status":"active","date":"2026-07-01","text":"ตั้งแต่วันที่ 1 กรกฎาคม 2026 พนักงานทำงานจากที่บ้าน (WFH) ได้สูงสุด 3 วันต่อสัปดาห์ และต้องเข้าออฟฟิศอย่างน้อย 2 วัน\nวันอังคารและวันพฤหัสบดีเป็นวันทีม ทุกคนต้องเข้าออฟฟิศ ยกเว้นได้รับอนุมัติจากผู้อำนวยการฝ่าย"},{"id":"HR-02#3","doc":"HR-02","title":"การทำงานแบบไฮบริด","section":"การทำงานจากต่างประเทศ","status":"active","date":"2026-07-01","text":"ทำงานจากต่างประเทศได้ไม่เกิน 14 วันต่อปีปฏิทิน ต้องขออนุมัติจากหัวหน้างานและฝ่ายทรัพยากรบุคคลล่วงหน้าอย่างน้อย 10 วันทำการ\nระหว่างทำงานจากต่างประเทศต้องเชื่อมต่อผ่าน VPN ของบริษัทเท่านั้น"},{"id":"HR-02#4","doc":"HR-02","title":"การทำงานแบบไฮบริด","section":"อุปกรณ์สำหรับทำงานที่บ้าน","status":"active","date":"2026-07-01","text":"บริษัทให้เงินช่วยเหลือค่าอินเทอร์เน็ต 500 บาทต่อเดือน จ่ายพร้อมเงินเดือน และให้ยืมจอภาพเพิ่ม 1 จอ ขอผ่านระบบ ServiceDesk"},{"id":"HR-03#1","doc":"HR-03","title":"สวัสดิการพนักงาน","section":"ประกันสุขภาพกลุ่ม","status":"active","date":"2026-01-01","text":"ผู้ป่วยนอก (OPD) เบิกได้ครั้งละไม่เกิน 2,000 บาท ไม่เกิน 30 ครั้งต่อปี\nผู้ป่วยใน (IPD) ค่าห้องไม่เกิน 4,000 บาทต่อคืน วงเงินค่ารักษารวมไม่เกิน 300,000 บาทต่อครั้ง\nใช้บัตรประกันที่โรงพยาบาลในเครือข่ายได้โดยไม่ต้องสำรองจ่าย"},{"id":"HR-03#2","doc":"HR-03","title":"สวัสดิการพนักงาน","section":"ทันตกรรมและสายตา","status":"active","date":"2026-01-01","text":"ค่าทำฟัน ขูดหินปูน อุดฟัน ถอนฟัน เบิกได้รวม 3,000 บาทต่อปี\nค่าแว่นสายตาหรือคอนแทกต์เลนส์ เบิกได้ 2,500 บาท ทุก 2 ปี\nเบิกผ่านระบบ e-Claim โดยแนบใบเสร็จฉบับจริงที่ออกในชื่อพนักงาน"},{"id":"HR-03#3","doc":"HR-03","title":"สวัสดิการพนักงาน","section":"กองทุนสำรองเลี้ยงชีพ","status":"active","date":"2026-01-01","text":"พนักงานเลือกสะสมได้ 3–10% ของเงินเดือน บริษัทสมทบเท่ากับที่พนักงานสะสม สูงสุด 5%\nสิทธิ์ในเงินสมทบของบริษัท: อายุงานต่ำกว่า 3 ปี ได้ 0% · 3–5 ปี ได้ 50% · ตั้งแต่ 5 ปี ได้ 100%"},{"id":"HR-03#4","doc":"HR-03","title":"สวัสดิการพนักงาน","section":"สุขภาพและความเป็นอยู่","status":"active","date":"2026-01-01","text":"เบิกค่าสมาชิกฟิตเนสหรือคลาสออกกำลังกายได้ 1,000 บาทต่อเดือน\nพนักงานและครอบครัวใช้บริการปรึกษาสุขภาพจิตออนไลน์ได้ฟรี 6 ครั้งต่อปี เป็นความลับ บริษัทไม่ทราบชื่อผู้ใช้บริการ"},{"id":"HR-04#1","doc":"HR-04","title":"การประเมินผลงาน","section":"รอบการประเมิน","status":"active","date":"2025-06-01","text":"ประเมินปีละ 2 รอบ คือ รอบกลางปี (มิถุนายน) และรอบปลายปี (ธันวาคม)\nพนักงานกรอกแบบประเมินตนเองใน HR Portal ก่อน แล้วหัวหน้างานประเมินและพูดคุยรายบุคคล"},{"id":"HR-04#2","doc":"HR-04","title":"การประเมินผลงาน","section":"ระดับผลงาน","status":"active","date":"2025-06-01","text":"มี 5 ระดับ คือ A (เกินความคาดหวังมาก) B (เกินความคาดหวัง) C (ตามความคาดหวัง) D (ต่ำกว่าความคาดหวัง) E (ต้องปรับปรุงเร่งด่วน)\nพนักงานที่ได้ D ติดกัน 2 รอบ จะเข้าแผนพัฒนาผลงาน (PIP) ระยะเวลา 90 วัน"},{"id":"HR-04#3","doc":"HR-04","title":"การประเมินผลงาน","section":"โบนัสและการขึ้นเงินเดือน","status":"active","date":"2025-06-01","text":"โบนัสจ่ายปีละครั้งในเดือนกุมภาพันธ์ อิงจากผลประกอบการบริษัทและระดับผลงานรอบปลายปี\nการปรับเงินเดือนประจำปีมีผลวันที่ 1 เมษายน"},{"id":"HR-05#1","doc":"HR-05","title":"คู่มือพนักงานใหม่","section":"วันแรก","status":"active","date":"2026-03-01","text":"พบเจ้าหน้าที่ทรัพยากรบุคคลที่ชั้น 5 เวลา 09.00 น. รับบัตรพนักงาน คอมพิวเตอร์ และบัญชีผู้ใช้\nทุกคนจะได้พี่เลี้ยง (buddy) 1 คนจากทีมอื่น ดูแลตลอดช่วงทดลองงาน"},{"id":"HR-05#2","doc":"HR-05","title":"คู่มือพนักงานใหม่","section":"ทดลองงาน","status":"active","date":"2026-03-01","text":"ระยะทดลองงาน 119 วัน หัวหน้างานประเมินเมื่อครบ 60 วันและ 110 วัน\nระหว่างทดลองงานยังไม่มีสิทธิ์ลาพักร้อน แต่ลาป่วยและลากิจได้ตามระเบียบ"},{"id":"HR-05#3","doc":"HR-05","title":"คู่มือพนักงานใหม่","section":"หลักสูตรบังคับ","status":"active","date":"2026-03-01","text":"ต้องผ่านหลักสูตรออนไลน์ 4 หลักสูตรภายใน 30 วันแรก: ความปลอดภัยไซเบอร์ · PDPA สำหรับพนักงาน · จรรยาบรรณ · การใช้เครื่องมือ AI อย่างรับผิดชอบ"},{"id":"HR-06#1","doc":"HR-06","title":"การลาออกและการคืนทรัพย์สิน","section":"การแจ้งลาออก","status":"active","date":"2025-01-01","text":"แจ้งลาออกเป็นลายลักษณ์อักษรผ่าน HR Portal ล่วงหน้าอย่างน้อย 30 วัน ระดับผู้จัดการขึ้นไปต้องแจ้งล่วงหน้า 60 วัน"},{"id":"HR-06#2","doc":"HR-06","title":"การลาออกและการคืนทรัพย์สิน","section":"การคืนทรัพย์สิน","status":"active","date":"2025-01-01","text":"คืนคอมพิวเตอร์ บัตรพนักงาน และอุปกรณ์ทั้งหมดที่ฝ่ายไอทีภายในวันทำงานสุดท้าย\nบัญชีผู้ใช้ทุกระบบจะถูกปิดเวลา 18.00 น. ของวันทำงานสุดท้าย"},{"id":"HR-06#3","doc":"HR-06","title":"การลาออกและการคืนทรัพย์สิน","section":"สิทธิ์ที่เหลือ","status":"active","date":"2025-01-01","text":"วันลาพักร้อนที่เหลือของปีนั้นบริษัทจ่ายเป็นเงิ /* ---------- TF-IDF core: same recipe as sklearn TfidfVectorizer(analyzer="char_wb", ngram_range=(2,4)) ---------- */
function charWb(text) {
  const out = [];
  const words = text.toLowerCase().split(/\s+/).filter(Boolean);
  for (const w0 of words) {
    const w = " " + w0 + " ";
    for (let n = 2; n <= 4; n++) {
      let off = 0;
      out.push(w.slice(off, off + n));
      while (off + n < w.length) { off++; out.push(w.slice(off, off + n)); }
    }
  }
  return out;
}
function buildIndex(chunks) {
  const vocab = new Map(), df = [], docs = [];
  chunks.forEach((c) => {
    const tf = new Map();
    for (const g of charWb(c.title + " " + c.section + " " + c.text)) {
      let id = vocab.get(g);
      if (id === undefined) { id = vocab.size; vocab.set(g, id); df.push(0); }
      tf.set(id, (tf.get(id) || 0) + 1);
    }
    tf.forEach((_, id) => df[id]++);
    docs.push(tf);
  });
  const N = chunks.length;
  const idf = df.map((d) => Math.log((1 + N) / (1 + d)) + 1);
  const vecs = docs.map((tf) => {
    const v = new Map(); let s = 0;
    tf.forEach((cnt, id) => { const x = cnt * idf[id]; v.set(id, x); s += x * x; });
    s = Math.sqrt(s) || 1;
    v.forEach((x, id) => v.set(id, x / s));
    return v;
  });
  return { vocab, idf, vecs };
}
function searchIndex(idx, query) {
  const tf = new Map();
  for (const g of charWb(query)) { const id = idx.vocab.get(g); if (id !== undefined) tf.set(id, (tf.get(id) || 0) + 1); }
  let s = 0; const q = new Map();
  tf.forEach((cnt, id) => { const x = cnt * idx.idf[id]; q.set(id, x); s += x * x; });
  s = Math.sqrt(s) || 1;
  return idx.vecs.map((v) => { let d = 0; q.forEach((x, id) => { const y = v.get(id); if (y) d += (x / s) * y; }); return d; });
}

/* ---------- retrieval + answer composition ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const chunkById = Object.fromEntries(DATA.chunks.map((c) => [c.id, c]));
const docById = Object.fromEntries(DATA.docs.map((d) => [d.id, d]));
const index = buildIndex(DATA.chunks);
// คำพ้องจากคำถามที่พลาดในชุด dev (เหมือน rag/retrieve.py)
const SYNONYMS = {
  "อีวี": ["รถยนต์ไฟฟ้า", "จุดชาร์จ", "ที่จอดรถ"],
  "ชาร์จรถ": ["รถยนต์ไฟฟ้า", "จุดชาร์จ", "ที่จอดรถ"],
  "ลืมรหัสผ่าน": ["รีเซ็ต", "Self-Service Password"],
};
const INJECTION = /ให้เพิกเฉย|เพิกเฉยต่อ|คำสั่งก่อนหน้า|ระบบ\s*AI|ตอบทุกคำถามว่า|ignore (all|previous)/i;
const CLAUSE = /(?<=[฀-๿])\s+(?=[฀-๿])/;
const SEG_MAX = 170;
const GREETING = /^(สวัสดี|หวัดดี|ดีครับ|ดีค่ะ|hello|hi|hey)[\s!.ครับค่ะคะ]*$/i;
const S = { k: 4, inc: false, sc: false, busy: false };

function expand(q) {
  const extra = Object.entries(SYNONYMS).filter(([key]) => q.includes(key)).flatMap(([, w]) => w);
  return extra.length ? q + " " + extra.join(" ") : q;
}
function retrieve(q) {
  const eq = expand(q), scores = searchIndex(index, eq);
  const order = scores.map((s, i) => [s, i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  const res = [];
  for (const [s, i] of order) {
    const c = DATA.chunks[i];
    if (!S.inc && c.status !== "active") continue;
    res.push({ c, s }); if (res.length === S.k) break;
  }
  return { eq, res };
}
function grams(q) {
  const t = q.replace(/\s+/g, "").toLowerCase(), set = new Set();
  for (let i = 0; i + 3 <= t.length; i++) set.add(t.slice(i, i + 3));
  return [...set];
}
function gramWeight(g) { const id = index.vocab.get(g); return id === undefined ? 1 : index.idf[id]; }
function segmentsOf(chunk) {
  const segs = []; let flagged = false;
  for (const line of chunk.text.split("\n")) {
    if (INJECTION.test(line)) { flagged = true; continue; }
    const t = line.trim();
    if (t.length <= SEG_MAX) { if (t) segs.push(t); continue; }
    let cur = "";
    for (const p of t.split(CLAUSE)) {
      if (cur && cur.length + 1 + p.length > SEG_MAX) { segs.push(cur); cur = p; } else cur = cur ? cur + " " + p : p;
    }
    if (cur) segs.push(cur);
  }
  return { segs, flagged };
}
function bestSegments(chunk, gs) {
  const { segs, flagged } = segmentsOf(chunk);
  const scored = segs.map((t, i) => {
    const low = t.toLowerCase(); let h = 0;
    for (const g of gs) if (low.includes(g)) h += gramWeight(g);
    // ประโยคแรกของหัวข้อมักบอกกฎหลัก จึงให้น้ำหนักเพิ่มเล็กน้อย
    return { t, i, sc: (h / (1 + t.length / 400)) * (i === 0 ? 1.2 : 1) };
  });
  return { scored: scored.sort((a, b) => b.sc - a.sc || a.i - b.i), flagged };
}
function compose(q, res, eq) {
  const gs = grams(eq), out = { sentences: [], flagged: [], conf: "low", refused: false };
  if (!res.length || res[0].s < 0.1) { out.refused = true; return out; }
  const top = res[0], b = bestSegments(top.c, gs);
  if (b.flagged) out.flagged.push(top.c.id);
  if (!b.scored.length || b.scored[0].sc === 0) { out.refused = true; return out; }
  const first = b.scored[0], second = b.scored[1];
  const picks = [first];
  if (second && second.sc >= first.sc * 0.6 && first.t.length + second.t.length < 300) picks.push(second);
  picks.sort((a, c) => a.i - c.i).forEach((p) => out.sentences.push({ t: p.t, id: top.c.id }));
  const other = res.slice(1).find((r) => r.c.doc !== top.c.doc || r.c.section !== top.c.section);
  if (other && other.s >= top.s * 0.75 && out.sentences.length < 3) {
    const o = bestSegments(other.c, gs);
    if (o.flagged) out.flagged.push(other.c.id);
    if (o.scored.length && o.scored[0].sc > 0) out.sentences.push({ t: o.scored[0].t, id: other.c.id });
  }
  out.conf = top.s >= 0.35 ? "high" : top.s >= 0.2 ? "mid" : "low";
  const oldChunk = top.c.status === "active" ? DATA.chunks.find((c) => c.doc === top.c.doc + "-2024" && c.section === top.c.section) : null;
  if (oldChunk) {
    const ob = bestSegments(oldChunk, gs);
    if (ob.scored.length && ob.scored[0].sc > 0 && !out.sentences.some((s) => s.t === ob.scored[0].t)) out.old = { t: ob.scored[0].t, id: oldChunk.id, ver: docById[oldChunk.doc].ver };
  }
  return out;
}
function highlight(text, query) {
  const q = query.replace(/\s+/g, ""), ranges = [], low = text.toLowerCase();
  for (let i = 0; i + 4 <= q.length; i++) {
    const g = q.slice(i, i + 4).toLowerCase(); let p = 0;
    while ((p = low.indexOf(g, p)) !== -1) { ranges.push([p, p + 4]); p++; }
  }
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const r of ranges) { const l = merged[merged.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push([...r]); }
  let out = "", pos = 0;
  for (const [a, b] of merged) { out += esc(text.slice(pos, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>" + ""; pos = b; }
  return out + esc(text.slice(pos));
}

function copy(text) {
  const done = () => toast("คัดลอกแล้ว");
  const fb = () => { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("คัดลอกไม่ได้ ลองเลือกข้อความเอง"); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fb); else fb();
}
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms));
const statusChip = (s) => s === "active" ? '<span class="chip ok">ฉบับปัจจุบัน</span>' : '<span class="chip warn">ฉบับเก่า</span>';
const CONF = { high: ["ok", "มั่นใจสูง"], mid: ["warn", "มั่นใจปานกลาง"], low: ["bad", "มั่นใจต่ำ"] };
function scrollEnd() { const log = $("#log"); const last = log.lastElementChild; if (last) last.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "end" }); }

/* ---------- theme / drawer ---------- */
(function theme() {
  const root = document.documentElement;
  try { const t = localStorage.getItem("nawa-theme"); if (t) root.dataset.theme = t; } catch (e) {}
  $("#theme").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark"; root.dataset.theme = next;
    try { localStorage.setItem("nawa-theme", next); } catch (e) {}
  });
})();
function setRail(open) {
  $("#rail").classList.toggle("open", open);
  $("#menu").setAttribute("aria-expanded", String(open));
  $("#scrim").hidden = !open && $("#sheet").hidden;
  if (open) { $("#scrim").hidden = false; $("#scrim").dataset.for = "rail"; } else if ($("#scrim").dataset.for === "rail") { $("#scrim").hidden = true; }
}
$("#menu").addEventListener("click", () => setRail(!$("#rail").classList.contains("open")));
$("#railclose").addEventListener("click", () => setRail(false));

/* ---------- sheet (sources) ---------- */
let sheetFrom = null;
function closeSheet() {
  $("#sheet").hidden = true; if ($("#scrim").dataset.for === "sheet") $("#scrim").hidden = true;
  if (sheetFrom && document.contains(sheetFrom)) sheetFrom.focus(); sheetFrom = null;
}
function openSheet(chunkId, query, from) {
  const c = chunkById[chunkId]; if (!c) return;
  sheetFrom = from || document.activeElement;
  const d = docById[c.doc], sibs = DATA.chunks.filter((x) => x.doc === c.doc);
  $("#sheet-title").innerHTML = `${esc(c.title)} <span class="muted" style="font-weight:400">› ${esc(c.section)}</span>`;
  $("#sheetbody").innerHTML = `<div class="meta"><span class="chip mono">${esc(c.id)}</span>${statusChip(c.status)}</div>
    <div class="text">${query ? highlight(c.text, query) : esc(c.text)}</div>
    <dl class="kv"><dt>เอกสาร</dt><dd><span class="mono">${esc(d.id)}</span> เวอร์ชัน ${esc(d.ver)}</dd><dt>ฝ่าย</dt><dd>${esc(d.dept)}</dd><dt>มีผลตั้งแต่</dt><dd>${esc(d.date)}</dd></dl>
    <div><div class="muted" style="font-size:13px;margin-bottom:6px">หัวข้อในเอกสารนี้</div><div class="secs">${sibs.map((s) => `<button type="button" data-id="${esc(s.id)}" aria-current="${s.id === c.id}">${esc(s.section)}</button>`).join("")}</div></div>
    <div><button class="btn" type="button" data-ask="${esc("ขอรายละเอียดเรื่อง " + c.section + " ใน" + c.title)}">ถามเรื่องนี้ในแชต</button></div>`;
  $("#sheet").hidden = false; $("#scrim").hidden = false; $("#scrim").dataset.for = "sheet";
  $("#sheetbody").scrollTop = 0; $("#sheetclose").focus();
}
$("#sheetclose").addEventListener("click", closeSheet);
$("#scrim").addEventListener("click", () => { if (!$("#sheet").hidden) closeSheet(); else setRail(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (!$("#sheet").hidden) closeSheet(); else if ($("#rail").classList.contains("open")) setRail(false); } });
$("#sheetbody").addEventListener("click", (e) => {
  const s = e.target.closest("button[data-id]"); if (s) { openSheet(s.dataset.id, "", sheetFrom); return; }
  const a = e.target.closest("button[data-ask]"); if (a) { closeSheet(); ask(a.dataset.ask); }
});

/* ---------- messages ---------- */
function addUser(text) {
  const el = document.createElement("div"); el.className = "msg user";
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`; $("#log").appendChild(el); return el;
}
function addBot(html) {
  const el = document.createElement("div"); el.className = "msg bot";
  el.innerHTML = `<div class="avatar" aria-hidden="true">N</div><div class="bubble">${html}</div>`; $("#log").appendChild(el); return el;
}
function stepsHtml(state) {
  const names = ["ค้นในเอกสาร 77 หัวข้อ", "เลือกหลักฐานที่ตรงที่สุด", "เรียบเรียงคำตอบพร้อมอ้างอิง"];
  return '<div class="steps" aria-label="ขั้นตอนการตอบ">' + names.map((n, i) => `<div class="${i < state ? "done" : i === state ? "run" : ""}"><span class="dot"></span>${n}</div>`).join("") + "</div>";
}
function answerHtml(q, r, ret) {
  const { res, eq } = ret;
  let h = "";
  if (r.refused) {
    const near = res[0] ? docById[res[0].c.doc] : null;
    h += `<div class="ans"><p><b>ไม่พบข้อมูลในเอกสาร</b></p><p class="muted">ไม่มีหัวข้อไหนในเอกสารที่ตรงกับคำถามนี้</p></div>`;
    h += `<div class="note info">ลองสอบถามฝ่าย${near ? ` <b>${esc(near.dept)}</b> (ใกล้เคียงที่สุด: ${esc(near.title)})` : "ที่เกี่ยวข้องโดยตรง"} หรือเปลี่ยนคำถามให้ใช้คำเดียวกับในระเบียบ</div>`;
  } else {
    if (r.conf === "low") h += '<p><b>ไม่พบข้อมูลที่ตรงกับคำถามนี้ชัดเจน</b> <span class="muted">ข้อความที่ใกล้เคียงที่สุดคือ</span></p>';
    h += '<div class="ans">' + r.sentences.map((s) => `<p>${esc(s.t)}<button class="cite" type="button" data-cite="${esc(s.id)}" aria-label="เปิดแหล่งอ้างอิง ${esc(s.id)}">${esc(s.id)}</button></p>`).join("") + "</div>";
    const [cls, label] = CONF[r.conf];
    h += `<div class="meta"><span class="chip ${cls}">${label}</span><span class="chip">จาก ${new Set(r.sentences.map((s) => s.id)).size} แหล่ง</span></div>`;
    if (r.conf === "low") {
      const near = docById[res[0].c.doc];
      h += `<div class="note">ถ้าข้อความข้างบนไม่ตอบคำถาม แปลว่าเอกสารอาจไม่มีเรื่องนี้ ลองสอบถามฝ่าย <b>${esc(near.dept)}</b> โดยตรง</div>`;
    }
    if (r.old) h += `<div class="note"><b>มีการเปลี่ยนแปลงจากฉบับเดิม</b> ตอบตามฉบับปัจจุบัน ฉบับเดิม (v${esc(r.old.ver)}) ระบุว่า:<div class="old-line">${esc(r.old.t)} <span class="mono">[${esc(r.old.id)}]</span></div></div>`;
  }
  if (r.flagged.length) h += `<div class="note"><b>พบข้อความที่เหมือนคำสั่งในเอกสาร</b> (${r.flagged.map((i) => `<span class="mono">${esc(i)}</span>`).join(", ")}) ระบบถือเป็นข้อมูล ไม่ทำตาม และไม่นำมาใช้ตอบ</div>`;
  if (res.length) {
    const top = res[0].s || 1;
    h += `<div class="src"><details><summary>แหล่งอ้างอิงที่ค้นเจอ (${res.length})</summary><div class="src-body">` +
      res.map((x, i) => `<div class="hit"><div class="meta"><span class="chip mono">${i + 1}</span><span class="chip mono">${esc(x.c.id)}</span>${statusChip(x.c.status)}</div>
        <button class="t" type="button" data-cite="${esc(x.c.id)}">${esc(x.c.title)} › ${esc(x.c.section)}</button>
        ${S.sc ? `<div class="bar" title="คะแนน ${x.s.toFixed(3)}"><i style="width:${Math.max(3, (x.s / top) * 100)}%"></i></div><div class="qinfo mono">คะแนน ${x.s.toFixed(3)}</div>` : ""}
        <p>${highlight(x.c.text.length > 220 ? x.c.text.slice(0, 220) + "…" : x.c.text, q)}</p></div>`).join("") +
      `<div class="qinfo">คำค้นที่ใช้: <code>${esc(eq)}</code><br>${S.inc ? "รวมฉบับเก่า" : "กรองฉบับเก่าออก"} · เรียงตามคะแนน TF-IDF ตัวอักษร 2–4 ตัว</div></div></details></div>`;
  }
  const fu = res[0] ? DATA.chunks.filter((c) => c.doc === res[0].c.doc && c.id !== res[0].c.id).slice(0, 3) : [];
  if (fu.length) h += `<div><div class="muted" style="font-size:13px;margin-bottom:6px">ถามต่อเรื่อง${esc(docById[res[0].c.doc].title)}</div><div class="follow">` +
    fu.map((c) => `<button type="button" data-ask="${esc("ขอรายละเอียดเรื่อง " + c.section + " ใน" + c.title)}">${esc(c.section)}</button>`).join("") + "</div></div>";
  h += `<div class="acts"><button class="btn" type="button" data-copy-answer><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>คัดลอกคำตอบ</button>
    <button class="btn" type="button" data-copy-ask="${esc("/ask " + q)}" title="ให้ Claude Code เรียบเรียงคำตอบเต็มด้วย skill /ask">คัดลอก /ask</button></div>`;
  return h;
}
async function ask(text) {
  const q = text.trim(); if (!q || S.busy) return;
  S.busy = true; $("#send").disabled = true;
  const w = $("#welcome"); if (w) w.remove();
  addUser(q); scrollEnd();
  if (GREETING.test(q)) {
    addBot('<p>สวัสดีครับ ถามเรื่องลา สวัสดิการ เบิกจ่าย IT หรือข้อมูลส่วนบุคคลได้เลย เช่น "ลาพักร้อนได้กี่วัน"</p>'); scrollEnd();
    S.busy = false; $("#send").disabled = !$("#input").value.trim(); return;
  }
  const bot = addBot(stepsHtml(0)); scrollEnd();
  const bubble = $(".bubble", bot);
  await sleep(380); bubble.innerHTML = stepsHtml(1);
  const ret = retrieve(q);
  await sleep(380); bubble.innerHTML = stepsHtml(2);
  const r = compose(q, ret.res, ret.eq);
  await sleep(380);
  bubble.innerHTML = answerHtml(q, r, ret);
  bubble.dataset.answer = r.refused ? "ไม่พบข้อมูลในเอกสาร" : r.sentences.map((s) => `${s.t} [${s.id}]`).join(" ");
  bubble.dataset.q = q;
  scrollEnd(); S.busy = false; $("#send").disabled = !$("#input").value.trim();
}
$("#log").addEventListener("click", (e) => {
  const c = e.target.closest("[data-cite]");
  if (c) { openSheet(c.dataset.cite, c.closest(".bubble").dataset.q || "", c); return; }
  const a = e.target.closest("[data-ask]"); if (a) { ask(a.dataset.ask); return; }
  if (e.target.closest("[data-copy-answer]")) { copy(e.target.closest(".bubble").dataset.answer || ""); return; }
  const ca = e.target.closest("[data-copy-ask]"); if (ca) copy(ca.dataset.copyAsk);
});

/* ---------- welcome, rail, composer ---------- */
const TOPICS = [
  ["ทรัพยากรบุคคล", ["ลาพักร้อนได้กี่วัน", "ลาป่วยกี่วันติดกันถึงต้องมีใบรับรองแพทย์", "ทำงานจากที่บ้านได้สูงสุดกี่วันต่อสัปดาห์", "ไปหาหมอฟันเบิกได้ปีละเท่าไร", "ผู้จัดการต้องแจ้งลาออกล่วงหน้ากี่วัน"]],
  ["การเงิน", ["ต้องส่งเบิกค่าใช้จ่ายภายในกี่วันหลังจ่ายเงิน", "ขับรถส่วนตัวไปพบลูกค้าเบิกค่าน้ำมันได้กิโลเมตรละเท่าไร", "ซื้อของมูลค่าเกินเท่าไรต้องเทียบราคา 3 ราย"]],
  ["เทคโนโลยีสารสนเทศ", ["ใส่รหัสผ่านผิดกี่ครั้งบัญชีถึงถูกล็อก และล็อกนานเท่าไร", "ข้อมูลระดับลับมากใส่ใน Claude ได้ไหม", "เผลอกดลิงก์ในเมลหลอกลวงแล้ว ต้องทำอะไร", "ลืมรหัสผ่านต้องทำอย่างไร"]],
  ["คุ้มครองข้อมูล", ["พบว่าข้อมูลลูกค้ารั่วไหล ต้องแจ้ง DPO ภายในกี่ชั่วโมง"]],
  ["อาคารสถานที่", ["เสียบชาร์จรถอีวีที่ออฟฟิศได้นานแค่ไหน", "จองห้องประชุมล่วงหน้าได้กี่วัน"]],
  ["บริการลูกค้า", ["ลูกค้าแพ็กเกจรายปีขอคืนเงินได้ภายในกี่วัน", "ต้องตอบอีเมลลูกค้าภายในกี่วัน"]],
];
$("#topics").innerHTML = TOPICS.map(([d, qs], i) => `<details ${i === 0 ? "open" : ""}><summary>${esc(d)}</summary><div class="qs">${qs.map((q) => `<button type="button" data-ask="${esc(q)}">${esc(q)}</button>`).join("")}</div></details>`).join("");
$("#docs").innerHTML = DATA.docs.map((d) => `<button type="button" data-doc="${esc(d.id)}" title="${esc(d.dept)} · v${esc(d.ver)}"><span class="id">${esc(d.id)}</span><span class="${d.status !== "active" ? "old" : ""}">${esc(d.title)}</span></button>`).join("");
$("#rail").addEventListener("click", (e) => {
  const q = e.target.closest("[data-ask]"); if (q) { setRail(false); ask(q.dataset.ask); return; }
  const d = e.target.closest("[data-doc]"); if (d) { const first = DATA.chunks.find((c) => c.doc === d.dataset.doc); setRail(false); openSheet(first.id, "", d); }
});
function welcome() {
  const picks = [["ทรัพยากรบุคคล", "ลาพักร้อนได้กี่วัน"], ["การเงิน", "ขับรถส่วนตัวไปพบลูกค้าเบิกค่าน้ำมันได้กิโลเมตรละเท่าไร"], ["เทคโนโลยีสารสนเทศ", "ใส่รหัสผ่านผิดกี่ครั้งบัญชีถึงถูกล็อก และล็อกนานเท่าไร"], ["อาคารสถานที่", "เสียบชาร์จรถอีวีที่ออฟฟิศได้นานแค่ไหน"]];
  const el = addBot(`<div class="welcome" id="welcome-in"><h1>ถามเรื่องระเบียบ นาวา ดิจิทัล ได้เลย</h1>
    <p class="muted">ฉันค้นจากเอกสารบริษัท 24 ฉบับ แล้วตอบสั้น ๆ พร้อมระบุแหล่งอ้างอิงทุกข้อ กดรหัสอ้างอิงเพื่ออ่านต้นฉบับ ถ้าเอกสารมีทั้งฉบับเก่าและใหม่ ฉันตอบตามฉบับปัจจุบันและบอกว่าเปลี่ยนอะไร</p>
    <div class="starters">${picks.map(([d, q]) => `<button type="button" data-ask="${esc(q)}"><small>${esc(d)}</small>${esc(q)}</button>`).join("")}</div>
    <p class="muted" style="font-size:13px">คำตอบนี้เรียบเรียงในเบราว์เซอร์ด้วยการดึงประโยคจากเอกสาร ไม่ได้ใช้โมเดลภาษา หากต้องการคำตอบที่เรียบเรียงโดย Claude ใช้ <span class="mono">/ask</span> ใน Claude Code</p></div>`);
  el.id = "welcome";
}
function reset() { $("#log").innerHTML = ""; S.busy = false; welcome(); $("#input").value = ""; autosize(); }
$("#clear").addEventListener("click", reset);
const input = $("#input");
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; $("#send").disabled = S.busy || !input.value.trim(); }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#form").requestSubmit(); } });
$("#form").addEventListener("submit", (e) => { e.preventDefault(); const t = input.value; input.value = ""; autosize(); ask(t); });
$("#k").addEventListener("input", (e) => { S.k = +e.target.value; $("#kv").textContent = S.k; });
$("#inc").addEventListener("change", (e) => { S.inc = e.target.checked; });
$("#sc").addEventListener("change", (e) => { S.sc = e.target.checked; });

welcome();
</script>
